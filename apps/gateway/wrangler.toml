# component-gateway §Configuration. Secrets are not declared here: set
# SERVICE_SECRET and CLERK_SECRET_KEY with `wrangler secret put` for a deployed
# Worker, and in the git-ignored .dev.vars file for `wrangler dev` (README.md).
name = "agentdesk-gateway"
main = "src/index.ts"
# Not later than the workerd that @cloudflare/vitest-pool-workers bundles, so
# tests and deployments run with the same date.
compatibility_date = "2026-08-01"

# `GET /install.sh` bundles packages/installer/install.sh as text
# (`src/install.ts`), so the installer's file stays the only copy.
[[rules]]
type = "Text"
globs = ["**/*.sh"]
fallthrough = true

[vars]
PUBLIC_ORIGIN = "http://localhost:8787"
CONVEX_SITE_URL = "http://127.0.0.1:3211"
CLERK_PUBLISHABLE_KEY = ""

# §Sign-in endpoints: 10 `/device/start` calls per minute per client IP
# (`src/device.ts`).
[[ratelimits]]
name = "DEVICE_START_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# §Public HTTP API: 120 `/v1` requests per minute per API token, keyed by its
# credential id after authentication (`src/v1.ts`).
[[ratelimits]]
name = "API_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
