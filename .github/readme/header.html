<!--
  Source for header-light.png and header-dark.png, the README header.
  Render both from the repository root with Chrome:

  for t in light dark; do
    sed "s/class=\"THEME\"/class=\"$t\"/" .github/readme/header.html > .github/readme/header-$t.html
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=2 --default-background-color=00000000 --window-size=1600,720 \
      --screenshot="$PWD/.github/readme/header-$t.png" "file://$PWD/.github/readme/header-$t.html"
    rm .github/readme/header-$t.html
  done
-->
