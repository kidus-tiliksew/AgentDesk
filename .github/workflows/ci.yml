name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # pnpm/action-setup reads the version from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and test
        run: pnpm check

      - name: Check the published specification
        run: pnpm --filter @agentdesk/contract spec:check

      # CONVEX_DEPLOY_KEY holds a deploy key for the CI dev deployment, never
      # for production (component-repository §Continuous integration).
      - name: Generate and typecheck Convex code
        run: npx convex codegen --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
